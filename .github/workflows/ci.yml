name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build --package-path App
      - name: Test
        run: swift test --package-path App
      - name: Bundle app
        run: Scripts/make-app.sh
      - name: Installer syntax check
        run: sh -n install.sh
